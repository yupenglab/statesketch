name: Bug report
description: Report something that did not work as expected in StateSketch.
title: '[Bug]: '
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve the StateSketch pre-alpha. Please avoid including personal data.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the unexpected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: List the shortest sequence that reproduces the problem.
      placeholder: |
        1. Open the lab
        2. Choose ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, OS, and device
      description: Include these details only when they are relevant.
      placeholder: Chrome 140, Windows 11, laptop
  - type: textarea
    id: context
    attributes:
      label: Optional screenshot or additional context
      description: Add non-sensitive context that could help reproduce the issue.
